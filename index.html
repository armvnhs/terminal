<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>RETRO TERM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23231a12'/%3E%3Crect x='4' y='6' width='24' height='17' rx='3' fill='%23ff9b21' opacity='.9'/%3E%3Crect x='7' y='9' width='18' height='11' fill='%23150d04'/%3E%3Crect x='11' y='24' width='10' height='2' fill='%23ff9b21'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="amber">

  <div class="room">
    <div class="monitor">
      <main class="screen" id="screen">
        <div class="term" id="term" aria-live="polite"></div>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="flicker" aria-hidden="true"></div>
        <div class="glass" aria-hidden="true"></div>
      </main>
      <div class="chin" aria-hidden="true">
        <span class="brand">RETRO-TERM</span>
        <span class="led"></span>
      </div>
    </div>
  </div>

  <input id="ghost" class="ghost-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="terminal input">
  <script type="module" src="js/main.js"></script>
</body>
</html>
